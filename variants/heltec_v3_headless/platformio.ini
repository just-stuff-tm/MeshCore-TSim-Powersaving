; Heltec V3 repeater without the OLED display (MeshCore-TSim-Powersaving).
; Identical to env:Heltec_v3_repeater in variants/heltec_v3/platformio.ini except: no DISPLAY_CLASS,
; no display driver/UI sources, and the OLED is held in reset from boot (headless.cpp).

[env:Heltec_v3_repeater_headless]
extends = Heltec_lora32_v3
build_flags =
  ${Heltec_lora32_v3.build_flags}
  -D HEADLESS_OLED_OFF=1
  -D ADVERT_NAME='"Heltec Repeater"'
  -D ADVERT_LAT=0.0
  -D ADVERT_LON=0.0
  -D ADMIN_PASSWORD='"password"'
  -D MAX_NEIGHBOURS=50
;  -D MESH_PACKET_LOGGING=1
;  -D MESH_DEBUG=1
build_src_filter = ${Heltec_lora32_v3.build_src_filter}
  +<../variants/heltec_v3_headless>
  +<../examples/simple_repeater>
lib_deps =
  ${Heltec_lora32_v3.lib_deps}
  ${esp32_ota.lib_deps}
  bakercp/CRC32 @ ^2.0.0
